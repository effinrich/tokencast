name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  # Public anon/publishable Supabase key + project URL — safe to be plain env
  # vars, not secrets. RLS + the RPC-only design (see supabase/migrations/)
  # is what actually gates access, not secrecy of these values.
  SUPABASE_URL: https://nsvciivqvfnqmudpzrde.supabase.co
  SUPABASE_ANON_KEY: sb_publishable_hHLUpNNSFzOtqULKFK0aZQ_wG1TOpF2

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          version: 10
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm test
      - run: pnpm build
      - run: npx playwright install --with-deps chromium
      - run: pnpm test:e2e
